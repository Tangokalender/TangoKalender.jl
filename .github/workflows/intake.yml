# Issue forms (nytt-arrangement, rettelse) → event files → pull request for review. See site-intake.yml.
name: Intake
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  intake:
    uses: ./.github/workflows/site-intake.yml   # a data repo uses Tangokalender/TangoKalender.jl/…@v1
