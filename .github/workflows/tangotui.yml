# Tests TangoTUI (the experimental Tachikoma editor in TangoTUI/, Julia only) on pull requests and on main. The form
# logic it uses lives in the package (src/eventform.jl), so package changes run it too.
name: TangoTUI (experimental)
on:
  workflow_dispatch:
  pull_request:
    paths: ['TangoTUI/**', 'src/**', 'Project.toml', 'bin/make_tui_demo.jl', '.github/workflows/tangotui.yml']
  push:
    branches: [main]
    paths: ['TangoTUI/**', 'src/**', 'Project.toml', 'bin/make_tui_demo.jl', '.github/workflows/tangotui.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Test
        run: julia --project=TangoTUI -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
