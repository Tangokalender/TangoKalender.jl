name: Pages
on:
  push:
    branches: [main]
    paths:
      - 'events/**'
      - 'venues.json'
      - 'site.toml'
      - 'assets/**'
      - 'src/**'
      - 'schema/**'
      - 'Project.toml'
      - 'Manifest.toml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/site-pages.yml'
  workflow_dispatch:
  schedule:
    # Just after midnight Oslo time (22:17 UTC in summer, 23:17 UTC in winter; the other run is harmless). Odd minutes
    # avoid the congestion that delays on-the-hour schedules by hours. The embedded SVGs pick the right day themselves
    # (in <object>); the nightly build mainly refreshes <img> embeds, past events and the «Generert» timestamp.
    - cron: '17 22 * * *'
    - cron: '17 23 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  pages:
    uses: ./.github/workflows/site-pages.yml   # a data repo uses Tangokalender/TangoKalender.jl/…@v1
