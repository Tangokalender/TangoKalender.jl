name: Pages
on:
  push:
    branches: [main]
    paths:
      - 'events/**'
      - 'src/**'
      - 'schema/**'
      - 'Project.toml'
      - 'Manifest.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'   # nightly, refreshes the "Generert" timestamp
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Build site (validates first)
        env:
          TZ: Europe/Oslo   # the "Generert" timestamp uses local time; runners default to UTC
        # index.html, for-ki.html, llms.txt, schema/*.json and .nojekyll
        run: julia --project=. -m TangoKalender site events _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
