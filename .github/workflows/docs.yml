# Builds the documentation (docs/, Documenter) on pull requests and publishes it to the gh-pages branch from main
# (/dev/) and release tags (/stable/, /vX.Y.Z/): https://tango.oslo.no/TangoKalender.jl/ (the
# organisation's Pages sites share the custom domain of tangokalender.github.io)
name: Docs
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write   # deploydocs pushes to gh-pages with GITHUB_TOKEN
# Pushes to main and release tags both deploy to gh-pages, so they share one queue: run side by side (a release
# pushes both at once), one push was rejected and /vX.Y.Z/ was missing (v1.3.4). Pull requests only build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'docs-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
