# Opened from the «Rett opp» link on each card, prefilled via URL query parameters keyed by field id
# (see correction_fields/correction_url in src/correction.jl). Labels are the keys read by the parser – rename together.
name: Rett opp arrangement
description: Rett opp feil eller meld avlysning for et arrangement i kalenderen.
title: "[Rettelse]: "
labels: ["rettelse"]
body:
  - type: markdown
    attributes:
      value: |
        Feltene under viser det som står i kalenderen nå. **Endre bare det som er feil** og send inn –
        en robot lager et forslag som en redaktør ser over, og du får svar som en kommentar her.

        - Et **tomt** felt betyr «ingen endring».
        - Skriv **-** for å fjerne en opplysning (f.eks. DJ).
  - type: input
    id: arrangement_id
    attributes:
      label: Arrangement-ID
      description: Fylles ut automatisk – ikke endre.
    validations:
      required: true
  - type: dropdown
    id: gjelder
    attributes:
      label: Gjelder
      options:
        - Bare denne datoen
        - Denne og alle senere datoer i serien
      default: 0
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Som før
        - Avlyst
        - Gjennomføres
      default: 0
  - type: input
    id: tittel
    attributes:
      label: Tittel
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Som før
        - Milonga
        - Practica
        - Kurs
        - Kurs og milonga
        - Kurs og practica
        - Workshop
        - Festival
        - Maraton
        - Annet
      default: 0
  - type: input
    id: dato
    attributes:
      label: Dato
      description: ÅÅÅÅ-MM-DD. Kan bare endres for én dato om gangen.
  - type: input
    id: starttid
    attributes:
      label: Starttid
      placeholder: "20:30"
  - type: input
    id: sluttid
    attributes:
      label: Sluttid
      placeholder: "23:30"
  - type: input
    id: sted
    attributes:
      label: Sted
  - type: input
    id: adresse
    attributes:
      label: Adresse
  - type: input
    id: arrangor
    attributes:
      label: Arrangør
  - type: input
    id: dj
    attributes:
      label: DJ
  - type: input
    id: laerere
    attributes:
      label: Lærere
      description: Skilt med komma.
  - type: input
    id: pris
    attributes:
      label: Pris (kr)
  - type: input
    id: studentpris
    attributes:
      label: Studentpris (kr)
  - type: input
    id: kurspris
    attributes:
      label: Kurspris (kr)
  - type: checkboxes
    id: musikk
    attributes:
      label: Musikk
      description: Kryss av bare hvis musikken skal endres – da erstattes den med det du krysser av.
      options:
        - label: Tradisjonell
        - label: Alternativ / neo
        - label: Levende orkester
  - type: input
    id: flyer
    attributes:
      label: Flyer
      description: Lenke til bildet (https://…).
  - type: input
    id: video
    attributes:
      label: Video
      description: Lenke til YouTube eller Vimeo.
  - type: input
    id: lenke
    attributes:
      label: Lenke
  - type: textarea
    id: beskrivelse
    attributes:
      label: Beskrivelse
  - type: textarea
    id: kommentar
    attributes:
      label: Kommentar
      description: Valgfritt – forklar endringen for redaktøren.
  - type: checkboxes
    id: samtykke
    attributes:
      label: Samtykke
      options:
        - label: Personer som er nevnt (DJ, lærere, arrangør) har godtatt å bli oppført i den offentlige kalenderen.
          required: true
